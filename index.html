<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
        
        /* Horní panel s penězi */
        .header { background: #16213e; width: 100%; max-width: 480px; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f3460; }
        .money-display { font-size: 1.4rem; font-weight: bold; color: #4ecc71; }
        .income-display { font-size: 0.9rem; color: #e94560; }

        /* Věž a patra */
        .tower-container { width: 100%; max-width: 480px; display: flex; flex-direction: column-reverse; padding: 10px; gap: 10px; }
        .floor { background: #0f3460; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #e94560; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .floor-info { display: flex; flex-direction: column; }
        .floor-name { font-weight: bold; font-size: 1rem; }
        .floor-stats { font-size: 0.8rem; color: #a2a2a2; margin-top: 4px; }
        
        /* Tlačítka */
        .btn { background: #e94560; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        
        .build-btn { width: 100%; max-width: 480px; margin: 15px 0; padding: 15px; font-size: 1.1rem; background: #4ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div>Peníze: <span class="money-display" id="money">$0</span></div>
            <div class="income-display">+<span id="income">0</span> $/sec</div>
        </div>
        <button class="btn" onclick="resetGame()" style="background:#555; font-size:0.7rem;">Reset</button>
    </div>

    <button class="btn build-btn" id="build-btn" onclick="buildFloor()">Postavit nové patro ($<span id="build-cost">100</span>)</button>

    <div class="tower-container" id="tower"></div>

    <script>
        let gameState = {
            money: 100,
            floors: [
                { id: 1, name: "Kavárna", level: 1, baseIncome: 5, upgradeCost: 20 }
            ]
        };

        const floorTypes = ["Pizzerie", "Kancelář", "Obchod s obuví", "Posilovna", "Kino", "IT Firma", "Luxusní Hotel"];

        function getBuildCost() {
            return Math.floor(100 * Math.pow(1.8, gameState.floors.length - 1));
        }

        function updateUI() {
            document.getElementById('money').innerText = '$' + Math.floor(gameState.money).toLocaleString();
            
            let totalIncome = gameState.floors.reduce((sum, f) => sum + (f.baseIncome * f.level), 0);
            document.getElementById('income').innerText = totalIncome.toLocaleString();
            
            let buildCost = getBuildCost();
            document.getElementById('build-cost').innerText = buildCost.toLocaleString();
            document.getElementById('build-btn').disabled = gameState.money < buildCost;

            const towerEl = document.getElementById('tower');
            towerEl.innerHTML = '';

            gameState.floors.forEach((floor, index) => {
                let currentIncome = floor.baseIncome * floor.level;
                let floorDiv = document.createElement('div');
                floorDiv.className = 'floor';
                floorDiv.innerHTML = `
                    <div class="floor-info">
                        <span class="floor-name">Patro ${index + 1}: ${floor.name} (Lvl ${floor.level})</span>
                        <span class="floor-stats">Příjem: +$${currentIncome}/s</span>
                    </div>
                    <button class="btn" 
                            onclick="upgradeFloor(${index})" 
                            ${gameState.money < floor.upgradeCost ? 'disabled' : ''}>
                        Vylepšit ($${floor.upgradeCost})
                    </button>
                `;
                towerEl.appendChild(floorDiv);
            });
        }

        function buildFloor() {
            let cost = getBuildCost();
            if (gameState.money >= cost) {
                gameState.money -= cost;
                let randomName = floorTypes[Math.floor(Math.random() * floorTypes.length)];
                let newFloor = {
                    id: gameState.floors.length + 1,
                    name: randomName,
                    level: 1,
                    baseIncome: Math.floor(10 * Math.pow(1.5, gameState.floors.length)),
                    upgradeCost: Math.floor(50 * Math.pow(1.5, gameState.floors.length))
                };
                gameState.floors.push(newFloor);
                saveGame();
                updateUI();
            }
        }

        function upgradeFloor(index) {
            let floor = gameState.floors[index];
            if (gameState.money >= floor.upgradeCost) {
                gameState.money -= floor.upgradeCost;
                floor.level += 1;
                floor.upgradeCost = Math.floor(floor.upgradeCost * 1.6);
                saveGame();
                updateUI();
            }
        }

        // Herní smyčka (přičítání mincí každou sekundu)
        setInterval(() => {
            let totalIncome = gameState.floors.reduce((sum, f) => sum + (f.baseIncome * f.level), 0);
            gameState.money += totalIncome;
            saveGame();
            updateUI();
        }, 1000);

        function saveGame() {
            localStorage.setItem('tower_tycoon_save', JSON.stringify(gameState));
        }

        function loadGame() {
            let saved = localStorage.getItem('tower_tycoon_save');
            if (saved) gameState = JSON.parse(saved);
            updateUI();
        }

        function resetGame() {
            if(confirm("Opravdu chcete začít znovu?")) {
                localStorage.removeItem('tower_tycoon_save');
                location.reload();
            }
        }

        loadGame();
    </script>
</body>
</html>
